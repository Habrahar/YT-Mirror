<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Mirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view { flex: 1; overflow: hidden; display: none; flex-direction: column; }
    .view.active { display: flex; }

    /* ── Player ── */
    #view-player {
      align-items: center;
      justify-content: center;
      padding: 32px 24px 16px;
      overflow-y: auto;
    }

    #cover {
      width: min(260px, 68vw); height: min(260px, 68vw);
      border-radius: 16px; object-fit: cover;
      background: #1e1e1e; margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #cover[src=""] { visibility: hidden; }

    #title  { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 6px; max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #artist { font-size: 14px; color: #aaa; text-align: center; margin-bottom: 36px; max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .controls { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }

    .btn {
      background: none; border: none; color: #fff; cursor: pointer;
      padding: 12px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .btn:active { background: rgba(255,255,255,.1); transform: scale(.92); }
    .btn.play { background: #fff; color: #000; width: 68px; height: 68px; }
    .btn.play:active { background: #ddd; }

    #audio-btn {
      border: 1px solid #333; border-radius: 20px;
      padding: 8px 20px; font-size: 13px; color: #aaa;
      background: none; cursor: pointer; margin-bottom: 12px;
    }
    #status { font-size: 12px; color: #444; }

    /* ── Browse ── */
    #view-browse { background: #0f0f0f; }

    .browse-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #161616;
      border-bottom: 1px solid #222; flex-shrink: 0;
    }
    .browse-nav button {
      background: #222; border: none; color: #fff;
      border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .browse-nav button:active { background: #333; }
    #browse-title {
      flex: 1; font-size: 13px; color: #888;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    #browse-content { flex: 1; overflow-y: auto; padding-bottom: 8px; }

    .section { margin-top: 20px; }
    .section-title {
      font-size: 15px; font-weight: 600;
      padding: 0 16px 10px; color: #fff;
    }

    .cards-row {
      display: flex; gap: 12px;
      padding: 0 16px;
      overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .cards-row::-webkit-scrollbar { display: none; }

    .card {
      flex-shrink: 0; width: 140px; cursor: pointer;
      scroll-snap-align: start;
    }
    .card:active .card-thumb { opacity: .7; }
    .card-thumb {
      width: 140px; height: 140px; border-radius: 8px;
      object-fit: cover; background: #222; display: block;
      transition: opacity .15s;
    }
    .card-title    { font-size: 13px; font-weight: 600; margin-top: 7px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card-subtitle { font-size: 11px; color: #888; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* Список (без обложки или с маленькой) */
    .list-section { padding: 0 16px; }
    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer;
    }
    .list-item:active { background: rgba(255,255,255,.04); }
    .list-thumb { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #222; flex-shrink: 0; }
    .list-info  { flex: 1; overflow: hidden; }
    .list-title    { font-size: 14px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .list-subtitle { font-size: 12px; color: #888; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    #browse-empty { padding: 48px 24px; text-align: center; color: #444; font-size: 14px; }
    #browse-loader { padding: 48px 24px; text-align: center; color: #555; font-size: 14px; }

    /* ── Nav ── */
    nav {
      display: flex; border-top: 1px solid #1e1e1e; flex-shrink: 0;
    }
    nav button {
      flex: 1; background: none; border: none; color: #555;
      padding: 12px 0 10px; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; transition: color .15s;
    }
    nav button.active { color: #fff; }
  </style>
</head>
<body>

  <!-- Player -->
  <div id="view-player" class="view active">
    <img id="cover" src="" alt="">
    <div id="title">Подключение...</div>
    <div id="artist"></div>
    <div class="controls">
      <button class="btn" onclick="cmd('prev')">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn play" id="play-btn" onclick="cmd('toggle')">
        <svg id="icon-play"  width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" onclick="cmd('next')">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <button id="audio-btn" onclick="toggleAudio()">🔇 Включить аудио</button>
    <div id="status">Подключение...</div>
  </div>

  <!-- Browse -->
  <div id="view-browse" class="view">
    <div class="browse-nav">
      <button onclick="browseBack()">← Назад</button>
      <span id="browse-title">YouTube Music</span>
      <button onclick="loadPage()">↻</button>
    </div>
    <div id="browse-content">
      <div id="browse-loader">Загрузка...</div>
    </div>
  </div>

  <nav>
    <button id="tab-player" class="active" onclick="showTab('player')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v9.28a4 4 0 1 0 1 0V3h-1zm0 18a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
      Плеер
    </button>
    <button id="tab-browse" onclick="showTab('browse')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      Обзор
    </button>
  </nav>

  <audio id="audio"></audio>

  <script>
    // ── Tabs ──
    function showTab(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'browse') loadPage();
    }

    // ── Player ──
    function cmd(action) {
      fetch('/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
    }

    function applyTrack(data) {
      document.getElementById('title').textContent  = data.title  || '—';
      document.getElementById('artist').textContent = data.artist || '—';
      if (data.thumb) document.getElementById('cover').src = data.thumb;
      document.getElementById('icon-play').style.display  = data.isPlaying ? 'none' : '';
      document.getElementById('icon-pause').style.display = data.isPlaying ? ''     : 'none';
    }

    // ── WebSocket ──
    function connect() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
      ws.onopen    = () => { document.getElementById('status').textContent = 'Подключено'; };
      ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'track') applyTrack(m.data); };
      ws.onclose   = () => { document.getElementById('status').textContent = 'Переподключение...'; setTimeout(connect, 3000); };
      ws.onerror   = () => ws.close();
    }
    connect();

    // ── Audio ──
    let audioOn = false;
    const audio = document.getElementById('audio');
    const audioBtn = document.getElementById('audio-btn');
    function toggleAudio() {
      if (!audioOn) {
        audio.src = '/stream'; audio.play().catch(() => {});
        audioBtn.textContent = '🔊 Выключить аудио'; audioOn = true;
      } else {
        audio.pause(); audio.src = '';
        audioBtn.textContent = '🔇 Включить аудио'; audioOn = false;
      }
    }

    // ── Browse ──
    async function loadPage() {
      const content = document.getElementById('browse-content');
      content.innerHTML = '<div id="browse-loader">Загрузка...</div>';
      try {
        const res = await fetch('/page');
        const data = await res.json();
        document.getElementById('browse-title').textContent = data.pageTitle || 'YouTube Music';
        renderPage(data.sections);
      } catch {
        content.innerHTML = '<div id="browse-empty">Не удалось загрузить страницу</div>';
      }
    }

    function renderPage(sections) {
      const content = document.getElementById('browse-content');
      if (!sections || sections.length === 0) {
        content.innerHTML = '<div id="browse-empty">Нет данных — возможно страница ещё загружается</div>';
        return;
      }

      content.innerHTML = '';

      sections.forEach(section => {
        const sec = document.createElement('div');
        sec.className = 'section';

        // Определяем тип отображения по наличию обложек
        const hasCovers = section.items.some(i => i.thumb);
        const isGrid = hasCovers;

        if (section.title) {
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = section.title;
          sec.appendChild(h);
        }

        if (isGrid) {
          const row = document.createElement('div');
          row.className = 'cards-row';
          section.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img class="card-thumb" src="${item.thumb || ''}" loading="lazy" alt="">
              <div class="card-title">${esc(item.title)}</div>
              ${item.subtitle ? `<div class="card-subtitle">${esc(item.subtitle)}</div>` : ''}
            `;
            card.addEventListener('click', () => tapItem(item.idx));
            row.appendChild(card);
          });
          sec.appendChild(row);
        } else {
          const list = document.createElement('div');
          list.className = 'list-section';
          section.items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'list-item';
            row.innerHTML = `
              ${item.thumb ? `<img class="list-thumb" src="${item.thumb}" loading="lazy" alt="">` : ''}
              <div class="list-info">
                <div class="list-title">${esc(item.title)}</div>
                ${item.subtitle ? `<div class="list-subtitle">${esc(item.subtitle)}</div>` : ''}
              </div>
            `;
            row.addEventListener('click', () => tapItem(item.idx));
            list.appendChild(row);
          });
          sec.appendChild(list);
        }

        content.appendChild(sec);
      });
    }

    async function tapItem(idx) {
      await fetch('/page/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idx }),
      });
      // Перезагружаем страницу через секунду (могла смениться)
      setTimeout(loadPage, 1000);
    }

    async function browseBack() {
      await fetch('/page/back', { method: 'POST' });
      setTimeout(loadPage, 700);
    }

    function esc(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Mirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Views ── */
    .view { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
    .view.active { display: flex; }

    /* ── Player view ── */
    #view-player {
      align-items: center;
      justify-content: center;
      padding: 32px 24px 16px;
      gap: 0;
    }

    #cover {
      width: min(260px, 68vw);
      height: min(260px, 68vw);
      border-radius: 16px;
      object-fit: cover;
      background: #1e1e1e;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #cover[src=""] { visibility: hidden; }

    #title {
      font-size: 19px; font-weight: 700;
      text-align: center; margin-bottom: 6px;
      max-width: 320px; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }
    #artist {
      font-size: 14px; color: #aaa;
      text-align: center; margin-bottom: 36px;
      max-width: 320px; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }

    .controls { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }

    .btn {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: 12px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { background: rgba(255,255,255,0.1); transform: scale(0.92); }
    .btn.play { background: #fff; color: #000; width: 68px; height: 68px; }
    .btn.play:active { background: #ddd; }

    #status { font-size: 12px; color: #444; }

    /* ── Browse view ── */
    #view-browse { background: #000; position: relative; }

    .browse-bar {
      display: flex; align-items: center;
      padding: 10px 12px; gap: 8px;
      background: #111; border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    .browse-bar button {
      background: #222; border: none; color: #fff;
      border-radius: 8px; padding: 8px 14px;
      font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .browse-bar button:active { background: #333; }
    #url-display {
      flex: 1; font-size: 11px; color: #666;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    .snap-wrap {
      flex: 1; overflow: hidden; position: relative;
      display: flex; align-items: flex-start; justify-content: center;
    }
    #snap {
      width: 100%; height: auto;
      display: block; cursor: pointer;
      touch-action: none;
    }
    #snap-loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #444; font-size: 13px; pointer-events: none;
    }

    .scroll-bar {
      display: flex; justify-content: center; gap: 16px;
      padding: 10px; background: #111; flex-shrink: 0;
    }
    .scroll-bar button {
      background: #222; border: none; color: #fff;
      border-radius: 8px; padding: 8px 28px;
      font-size: 18px; cursor: pointer;
    }
    .scroll-bar button:active { background: #333; }

    /* ── Bottom nav ── */
    nav {
      display: flex; border-top: 1px solid #222;
      flex-shrink: 0;
    }
    nav button {
      flex: 1; background: none; border: none; color: #666;
      padding: 12px 0 10px; font-size: 11px;
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; cursor: pointer; transition: color 0.15s;
    }
    nav button.active { color: #fff; }
    nav button svg { display: block; }
  </style>
</head>
<body>

  <!-- ── Player ── -->
  <div id="view-player" class="view active">
    <img id="cover" src="" alt="Обложка">
    <div id="title">Подключение...</div>
    <div id="artist"></div>
    <div class="controls">
      <button class="btn" onclick="cmd('prev')" aria-label="Предыдущий">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn play" id="play-btn" onclick="cmd('toggle')">
        <svg id="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" onclick="cmd('next')" aria-label="Следующий">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div id="status">Подключение к серверу...</div>
    <button class="btn" id="audio-btn" onclick="toggleAudio()" style="margin-top:16px;border:1px solid #333;border-radius:20px;padding:8px 20px;font-size:13px;color:#aaa;">
      🔇 Включить аудио
    </button>
  </div>

  <!-- ── Browse ── -->
  <div id="view-browse" class="view">
    <div class="browse-bar">
      <button onclick="browseBack()">← Назад</button>
      <span id="url-display">music.youtube.com</span>
      <button onclick="refreshSnap()">↻</button>
    </div>
    <div class="snap-wrap">
      <img id="snap" alt="" draggable="false">
      <div id="snap-loading">Загрузка...</div>
    </div>
    <div class="scroll-bar">
      <button onclick="browseScroll('up')">↑</button>
      <button onclick="browseScroll('down')">↓</button>
    </div>
  </div>

  <!-- ── Bottom nav ── -->
  <nav>
    <button id="tab-player" class="active" onclick="showTab('player')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v9.28a4 4 0 1 0 1 0V3h-1zm0 18a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
      Плеер
    </button>
    <button id="tab-browse" onclick="showTab('browse')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      Обзор
    </button>
  </nav>

  <audio id="audio"></audio>

  <script>
    // ── Tab switching ──
    function showTab(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'browse') startBrowse();
      else stopBrowse();
    }

    // ── Player controls ──
    function cmd(action) {
      fetch('/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
      });
    }

    function applyTrack(data) {
      document.getElementById('title').textContent  = data.title  || '—';
      document.getElementById('artist').textContent = data.artist || '—';
      if (data.thumb) document.getElementById('cover').src = data.thumb;
      document.getElementById('icon-play').style.display  = data.isPlaying ? 'none' : '';
      document.getElementById('icon-pause').style.display = data.isPlaying ? ''     : 'none';
    }

    // ── WebSocket ──
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}`);
      ws.onopen    = () => { document.getElementById('status').textContent = 'Подключено'; };
      ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'track') applyTrack(m.data); };
      ws.onclose   = () => { document.getElementById('status').textContent = 'Переподключение...'; setTimeout(connect, 3000); };
      ws.onerror   = () => ws.close();
    }
    connect();

    // ── Audio ──
    let audioOn = false;
    const audio = document.getElementById('audio');
    const audioBtn = document.getElementById('audio-btn');

    function toggleAudio() {
      if (!audioOn) {
        audio.src = '/stream';
        audio.play().catch(() => {});
        audioBtn.textContent = '🔊 Выключить аудио';
        audioOn = true;
      } else {
        audio.pause();
        audio.src = '';
        audioBtn.textContent = '🔇 Включить аудио';
        audioOn = false;
      }
    }

    // ── Browse ──
    let snapTimer = null;
    const snap = document.getElementById('snap');
    const snapLoading = document.getElementById('snap-loading');

    function refreshSnap() {
      snap.src = '/browse/snap?' + Date.now();
    }

    function startBrowse() {
      refreshSnap();
      snapTimer = setInterval(refreshSnap, 2000);
    }

    function stopBrowse() {
      clearInterval(snapTimer);
      snapTimer = null;
    }

    snap.onload = () => { snapLoading.style.display = 'none'; };

    snap.addEventListener('click', (e) => {
      const rect = snap.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top)  / rect.height;
      fetch('/browse/tap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x, y }),
      }).then(() => setTimeout(refreshSnap, 900));
    });

    function browseBack() {
      fetch('/browse/back', { method: 'POST' }).then(() => setTimeout(refreshSnap, 800));
    }

    function browseScroll(dir) {
      fetch('/browse/scroll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir }),
      }).then(() => setTimeout(refreshSnap, 300));
    }
  </script>
</body>
</html>

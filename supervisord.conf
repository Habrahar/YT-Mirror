[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport %(ENV_VNC_PORT)s -wait 50 -noxdamage -framerate 15
autorestart=true
priority=2
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=3
startsecs=4
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

[program:chromium]
command=chromium
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --kiosk
    --disable-extensions
    --disable-translate
    --no-first-run
    --disable-infobars
    --autoplay-policy=no-user-gesture-required
    --user-data-dir=/data/chrome-profile
    --js-flags="--max-old-space-size=256"
    https://music.youtube.com
environment=DISPLAY=":99",PULSE_SERVER="unix:/tmp/pulse-socket"
autorestart=true
priority=4
startsecs=6
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.log

[program:audio-stream]
command=bash -c "sleep 14 && ffmpeg -f pulse -i virtual_out.monitor -acodec libmp3lame -b:a 128k -f mp3 -multiple_requests 1 -listen 1 http://0.0.0.0:%(ENV_AUDIO_PORT)s/audio.mp3"
autorestart=true
priority=5
startsecs=15
stdout_logfile=/var/log/supervisor/audio.log
stderr_logfile=/var/log/supervisor/audio.log

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport %(ENV_VNC_PORT)s -wait 50 -noxdamage
autorestart=true
priority=2
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=3
startsecs=4
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

[program:chromium]
command=chromium
    --no-sandbox
    --disable-dev-shm-usage
    --disable-gpu
    --kiosk
    --disable-extensions
    --disable-translate
    --no-first-run
    --disable-infobars
    --user-data-dir=/data/chrome-profile
    https://music.youtube.com
environment=DISPLAY=":99"
autorestart=true
priority=4
startsecs=6
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.log
